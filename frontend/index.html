<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موعدي — لوحة تحكم العيادة</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="authView" class="auth-shell">
  <div class="diamond-rule" style="margin-bottom:24px;border-radius:6px;"></div>
  <h1>موعدي</h1>
  <p class="tagline">نظام حجز وتذكير للعيادات — بلا مواعيد ضائعة</p>

  <div class="card">
    <form id="loginForm">
      <label>اسم المستخدم</label>
      <input type="text" id="loginUsername" required>
      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" required>
      <button class="btn btn-primary btn-full" type="submit">تسجيل الدخول</button>
      <div class="error-msg" id="loginError"></div>
    </form>
    <div class="switch-mode">ليس لديك حساب؟ <a onclick="showRegister()">أنشئ عيادتك الآن</a></div>
  </div>

  <form id="registerForm" class="card hidden">
    <label>اسم العيادة</label>
    <input type="text" id="regName" required placeholder="مثال: عيادة الأمل">
    <label>رقم هاتف العيادة (لأغراض التذكيرات)</label>
    <input type="text" id="regPhone" required placeholder="222XXXXXXXX">
    <label>اسم المستخدم</label>
    <input type="text" id="regUsername" required>
    <label>كلمة المرور</label>
    <input type="password" id="regPassword" required minlength="6">
    <label>بداية الدوام</label>
    <input type="time" id="regStart" value="08:00">
    <label>نهاية الدوام</label>
    <input type="time" id="regEnd" value="17:00">
    <button class="btn btn-accent btn-full" type="submit">إنشاء الحساب</button>
    <div class="error-msg" id="regError"></div>
    <div class="switch-mode">لديك حساب؟ <a onclick="showLogin()">سجل الدخول</a></div>
  </form>
</div>

<div id="dashView" class="hidden">
  <div class="diamond-rule"></div>
  <div class="topbar">
    <span class="brand"><span class="dot"></span> موعدي</span>
    <span class="clinic-name" id="clinicNameLabel"></span>
    <button class="logout" onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="container">

    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="font-size:0.85rem;color:var(--ink-muted);">رابط الحجز الخاص بعيادتك، شاركه مع مرضاك:</div>
        <div id="bookingLink" style="font-family:'Cairo',sans-serif;font-weight:700;color:var(--indigo-deep);"></div>
      </div>
      <button class="btn btn-ghost btn-small" onclick="copyBookingLink()">نسخ الرابط</button>
    </div>

    <div class="stats-row">
      <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">مواعيد اليوم</div></div>
      <div class="stat-box"><div class="num" id="statConfirmed">0</div><div class="lbl">مؤكدة</div></div>
      <div class="stat-box"><div class="num" id="statPending">0</div><div class="lbl">بانتظار التأكيد</div></div>
    </div>

    <div class="card">
      <div class="section-head">
        <h2>مواعيد اليوم</h2>
        <div class="date-nav">
          <button onclick="shiftDate(-1)">‹</button>
          <input type="date" id="dateInput" style="width:auto;">
          <button onclick="shiftDate(1)">›</button>
        </div>
      </div>
      <div id="apptList" class="appt-list"></div>
    </div>

    <div class="card">
      <div class="section-head"><h2>إضافة موعد يدوياً</h2></div>
      <form id="addApptForm">
        <label>اسم المريض</label>
        <input type="text" id="apName" required>
        <label>رقم هاتف المريض (واتساب)</label>
        <input type="text" id="apPhone" required placeholder="222XXXXXXXX">
        <label>التاريخ والوقت</label>
        <input type="datetime-local" id="apTime" required>
        <label>سبب الزيارة (اختياري)</label>
        <input type="text" id="apReason">
        <button class="btn btn-primary btn-full" type="submit">إضافة الموعد</button>
        <div class="success-msg" id="addSuccess">تمت إضافة الموعد بنجاح</div>
      </form>
    </div>

  </div>
  <footer class="brand-footer">موعدي — صُنع لعيادات موريتانيا 🇲🇷</footer>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
