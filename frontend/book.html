<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احجز موعدك</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="diamond-rule"></div>
<div class="booking-hero">
  <h1 id="clinicName">جارِ التحميل...</h1>
  <p id="clinicPhone"></p>
</div>

<div class="container" style="max-width:520px;">

  <div id="bookingCard" class="card">
    <label>الاسم الكامل</label>
    <input type="text" id="pName" required>
    <label>رقم الهاتف (واتساب — لإرسال تذكير قبل الموعد)</label>
    <input type="text" id="pPhone" required placeholder="222XXXXXXXX">
    <label>سبب الزيارة (اختياري)</label>
    <input type="text" id="pReason">

    <label>اختر التاريخ</label>
    <input type="date" id="pDate">

    <label>اختر الوقت المتاح</label>
    <div id="slotsGrid" class="slots-grid"><div class="empty-state">اختر تاريخاً لعرض الأوقات المتاحة</div></div>

    <button class="btn btn-primary btn-full" id="confirmBtn" disabled onclick="confirmBooking()">تأكيد الحجز</button>
    <div class="error-msg" id="bookError"></div>
  </div>

  <div id="successCard" class="card hidden" style="text-align:center;">
    <div style="font-size:2.2rem;">✅</div>
    <h2>تم إرسال طلب حجزك</h2>
    <p style="color:var(--ink-muted);">ستصلك رسالة واتساب لتأكيد الموعد، وتذكير قبل موعدك بيوم واحد.</p>
  </div>

</div>
<footer class="brand-footer">مدعوم بواسطة موعدي</footer>

<script src="js/booking.js"></script>
</body>
</html>
