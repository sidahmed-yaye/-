<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — موعدي</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-topbar { background: var(--indigo-deep); }
  table.clinics-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.clinics-table th { text-align: right; padding: 10px 8px; color: var(--ink-muted); font-size: 0.78rem; border-bottom: 2px solid var(--indigo-soft); }
  table.clinics-table td { padding: 10px 8px; border-bottom: 1px solid #F0ECE0; vertical-align: middle; }
  .status-pill { padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  .status-pill.active { background: var(--success-bg); color: var(--success); }
  .status-pill.disabled { background: var(--danger-bg); color: var(--danger); }
  .dues-input { width: 80px; padding: 5px 8px; font-size: 0.85rem; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>

<div id="adminAuthView" class="auth-shell">
  <div class="diamond-rule" style="margin-bottom:24px;border-radius:6px;"></div>
  <h1>لوحة الإدارة</h1>
  <p class="tagline">موعدي — دخول خاص بالمدير</p>
  <div class="card">
    <form id="adminLoginForm">
      <label>اسم المستخدم</label>
      <input type="text" id="adminUsername" required>
      <label>كلمة المرور</label>
      <input type="password" id="adminPassword" required>
      <button class="btn btn-primary btn-full" type="submit">تسجيل الدخول</button>
      <div class="error-msg" id="adminLoginError"></div>
    </form>
  </div>
</div>

<div id="adminDashView" class="hidden">
  <div class="diamond-rule"></div>
  <div class="topbar admin-topbar">
    <span class="brand"><span class="dot"></span> لوحة الإدارة</span>
    <button class="logout" onclick="adminLogout()">تسجيل الخروج</button>
  </div>

  <div class="container">
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="statClinicsTotal">0</div><div class="lbl">إجمالي العيادات</div></div>
      <div class="stat-box"><div class="num" id="statClinicsActive">0</div><div class="lbl">نشطة</div></div>
      <div class="stat-box"><div class="num" id="statDuesTotal">0</div><div class="lbl">إجمالي المستحقات (أوقية)</div></div>
    </div>

    <div class="card">
      <div class="section-head"><h2>كل العيادات</h2></div>
      <div class="table-wrap">
        <table class="clinics-table">
          <thead>
            <tr>
              <th>العيادة</th>
              <th>الحالة</th>
              <th>الفترة المجانية</th>
              <th>الحجوزات</th>
              <th>المستحق</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="clinicsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <footer class="brand-footer">موعدي — لوحة الإدارة</footer>
</div>

<script src="js/admin.js"></script>
</body>
</html>
